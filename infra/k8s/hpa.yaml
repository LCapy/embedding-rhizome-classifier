# Requires the metrics-server add-on (not installed by default on EKS -
# see infra/README.md).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: coredrill-api
  namespace: coredrill
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: coredrill-api
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
