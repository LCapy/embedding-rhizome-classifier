    }
    if (!mass.has(best) && best >= 0) ring(Q[best], Math.max(8, Math.min(26, .2 * Q[best].k)), soft(N[best].color, .5), ease * .9, 1.8);
    const r = Math.max(4, Math.min(10, .075 * me.k)), s = g.createRadialGradient(me.x, me.y, 0, me.x, me.y, r * 3.2); s.addColorStop(0, css(IVORY, .95)); s.addColorStop(.28, css(IVORY, .8)); s.addColorStop(.36, css(IVORY, .2)); s.addColorStop(1, css(IVORY, 0)); g.fillStyle = s; g.beginPath(); g.arc(me.x, me.y, r * 3.2, 0, 7); g.fill();
    label("Your text", me, IVORY, 1, 13, 600, r + 18, true);
    if (best >= 0) label(N[best].name, Q[best], soft(N[best].color, .55), ease, 15, 600, -18, true);
    for (const i of mass.keys()) if (i !== best) label(N[i].name, Q[i], soft(N[i].color, .3), .95 * ease, 13, 600, -16, true);
  }
  if (hover >= 0) { ring(Q[hover], Math.max(7, Math.min(22, .17 * Q[hover].k)), soft(N[hover].color, .4), .8, 1.2); label(N[hover].name, Q[hover], soft(N[hover].color, .5), 1, 13, 600, -15, true); for (const [j] of N[hover].near) { g.beginPath(); g.moveTo(Q[hover].x, Q[hover].y); g.lineTo(Q[j].x, Q[j].y); g.strokeStyle = css(N[j].color, .5); g.lineWidth = 1; if (Q[j].z > .1) { g.stroke(); label(N[j].name, Q[j], soft(N[j].color, .2), .85, 12, 500, -12, true); } } }
  const dim = result ? .6 : 1, named = new Set();
  for (const d of map.domains) { const G = map.galaxy[d], p = project(G.c), px = G.r * p.k; if (label(d, p, soft(map.domainColor[d], .3), dim * Math.max(0, Math.min(.9, (300 - px) / 90)), 14, 600, -Math.min(px * .7, 70), false)) named.add(d); }
  const order = N.map((_, i) => i).filter(i => i !== hover && i !== best && !mass.has(i)).sort((a, b) => (N[a].level - N[b].level) || (Q[a].z - Q[b].z));
  for (const i of order) { const n = N[i], k = Q[i].k; if (n.level === 1 && named.has(n.name)) continue; const need = n.level <= 1 ? 62 : n.level === 2 ? 46 : n.level === 3 ? 92 : 125; if (k > need) label(n.name, Q[i], soft(n.color, .12), dim * Math.min(.85, (k - need) / 40) * (n.data ? 1 : .6), n.level <= 2 ? 12.5 : 12, n.level <= 2 ? 600 : 400, -11, false); }
}

// ── frame ──
let dragging = null, before = 0;
function frame(t) {
  requestAnimationFrame(frame); if (document.hidden || t - before < 15) return;      // 60 a second is plenty
  const dt = Math.min(.5, (t - before) / 1000); before = t; const e = still ? 1 : 1 - Math.exp(-3.2 * dt), q = still ? 1 : 1 - Math.exp(-8 * dt);
  for (let i = 0; i < 3; i++) cam.t[i] += (goal.t[i] - cam.t[i]) * e; cam.d += (goal.d - cam.d) * e; cam.yaw += (goal.yaw - cam.yaw) * q; cam.pitch += (goal.pitch - cam.pitch) * q;
  if (!still && !dragging) goal.yaw += (result ? .02 : .042) * dt;
  const wide = W > 1000, want = wide ? ($("out").hidden ? 185 : 0) : 0; off += (want - off) * e; A = axes();
  const M = matrix(), K = H / 2 / Math.tan(FOV / 2) * (canvas.width / W); gl.viewport(0, 0, canvas.width, canvas.height); gl.clearColor(.047, .05, .06, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  if (map) {
    const dim = result ? .62 : 1, use = p => { gl.useProgram(p.p); gl.uniformMatrix4fv(p.u.M, false, M); };
    use(P.glow); gl.uniform3fv(P.glow.u.R, A.r); gl.uniform3fv(P.glow.u.U, A.u); gl.uniform1f(P.glow.u.K, K); gl.uniform1f(P.glow.u.cap, 1e6); gl.uniform1f(P.glow.u.core, 0); gl.bindVertexArray(clouds.a); gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, clouds.n);
    use(P.line); gl.uniform1f(P.line.u.dim, dim); gl.bindVertexArray(threads.a); gl.drawArrays(gl.LINES, 0, threads.n); gl.bindVertexArray(lines.a); gl.drawArrays(gl.LINES, 0, lines.n);
    if (stars) { use(P.star); gl.uniform1f(P.star.u.K, K); gl.uniform1f(P.star.u.dim, .5 * dim); gl.bindVertexArray(stars.a); gl.drawArrays(gl.POINTS, 0, stars.n); }
    use(P.glow); gl.uniform1f(P.glow.u.cap, 62 * canvas.width / W); gl.uniform1f(P.glow.u.core, 1); gl.bindVertexArray(suns.a); gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, suns.n); gl.bindVertexArray(null);
  }
  labels(t);
}

// ── moving about ──
let last = null, moved = 0;
canvas.addEventListener("pointerdown", e => { dragging = e.shiftKey || e.button === 2 ? "pan" : "turn"; last = [e.clientX, e.clientY]; moved = 0; canvas.classList.add("drag"); canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener("contextmenu", e => e.preventDefault());
canvas.addEventListener("pointermove", e => {
  if (dragging) {
    const dx = e.clientX - last[0], dy = e.clientY - last[1]; moved += Math.abs(dx) + Math.abs(dy); last = [e.clientX, e.clientY]; $("tip").hidden = true;
    if (dragging === "turn") { goal.yaw -= dx * .006; goal.pitch = Math.max(-1.45, Math.min(1.45, goal.pitch + dy * .005)); }
    else { const k = cam.d * Math.tan(FOV / 2) * 2 / H; for (let i = 0; i < 3; i++) goal.t[i] += (-dx * A.r[i] + dy * A.u[i]) * k; } return;
  }
  const b = canvas.getBoundingClientRect(), x = e.clientX - b.left, y = e.clientY - b.top; let best = 16, at = -1; seen.forEach((p, i) => { if (p.z > .1) { const d = Math.hypot(p.x - x, p.y - y); if (d < best) { best = d; at = i; } } });
  hover = at; canvas.style.cursor = at >= 0 ? "pointer" : ""; tip(at, e.clientX, e.clientY);
});
addEventListener("pointerup", () => { if (dragging && moved < 5 && hover >= 0) { const n = map.nodes[hover]; fly(n.xyz, n.level <= 1 ? 7 : 3.2); } dragging = null; canvas.classList.remove("drag"); });
canvas.addEventListener("pointerleave", () => { if (!dragging) { hover = -1; $("tip").hidden = true; } });
canvas.addEventListener("wheel", e => { e.preventDefault(); goal.d = Math.max(.8, Math.min(70, goal.d * Math.exp(e.deltaY * .0011))); }, { passive: false });
canvas.addEventListener("dblclick", () => home());
canvas.addEventListener("keydown", e => {
  const turn = { ArrowLeft: [-.14, 0], ArrowRight: [.14, 0], ArrowUp: [0, .1], ArrowDown: [0, -.1] }[e.key]; if (turn) { goal.yaw += turn[0]; goal.pitch = Math.max(-1.45, Math.min(1.45, goal.pitch + turn[1])); e.preventDefault(); }
  if (e.key === "+" || e.key === "=") goal.d = Math.max(.8, goal.d / 1.2); if (e.key === "-") goal.d = Math.min(70, goal.d * 1.2); if (e.key === "Home" || e.key === "Escape") home();
});
function home() { fly(HOME.t, HOME.d); }
function tip(i, x, y) {
  const box = $("tip"); box.hidden = i < 0; if (i < 0) return; const n = map.nodes[i]; box.textContent = "";
  box.append(el("b", "", n.name), el("span", "", n.path.join(" → ")));
  if (!n.data) box.append(el("span", "", "No texts yet, so it cannot be an answer.")); else {
    box.append(el("span", "", `${n.texts.toLocaleString("en")} texts of its own`)); if (n.twins.length) box.append(el("span", "warn", `Same texts as ${n.twins.map(j => map.nodes[j].name).join(", ")}: the model cannot tell them apart.`));
    box.append(el("em", "", "Most alike in all " + map.geometry.dims + " dimensions"));
    for (const [j, c] of n.near) box.append(el("span", "", `${c.toFixed(2)}  ${map.nodes[j].name}`));
  }
  box.style.left = Math.max(8, Math.min(x + 16, innerWidth - 300)) + "px"; box.style.top = Math.max(8, Math.min(y + 16, innerHeight - box.offsetHeight - 10)) + "px";
}

// ── asking ──
function say(text, bad) { const s = $("status"); s.textContent = text; s.classList.toggle("bad", !!bad); }
async function get(url, options) {
  let r; try { r = await fetch(url, options); } catch { throw new Error("The view is not running any more. Start it with: python -m train view"); }
  const v = await r.json(); if (!r.ok) throw new Error(v.error || `error ${r.status}`); return v;
}
async function working(message, fn) {
  if (busy) return; busy = true; for (const id of ["go", "sample", "model"]) $(id).disabled = true; say(message);
  try { await fn(); } catch (e) { say(e.message, true); } finally { busy = false; for (const id of ["go", "sample", "model"]) $(id).disabled = false; }
}
const run = () => "?run=" + encodeURIComponent($("model").value);
async function loadMap() {
  const m = await get("/api/classify/map" + run()); m.index = {}; m.nodes.forEach((n, i) => m.index[n.name] = i); paint(m);
  drop(clouds, suns, lines, threads, stars); stars = null; result = null; $("out").hidden = true; map = m; build(); home(); key(m);
  const blank = m.nodes.filter(n => !n.data).length; say(`Ready: ${m.territories} territories with texts, ${blank} without.`);
  get("/api/classify/stars" + run()).then(s => { if (map === m) loadStars(s); }).catch(e => say("Ready, without the stars: " + e.message, true));
}
async function classify() {
  const text = $("text").value.trim(); if (!text) { say("Write a text first.", true); $("text").focus(); return; }
  const r = await get("/api/classify", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text, run: $("model").value }) });
  result = r; started = performance.now(); show(r);
  const far = Math.max(1, ...r.active.map(a => map.index[a.node]).concat(map.index[r.best.node]).filter(i => i !== undefined).map(i => Math.hypot(...map.nodes[i].xyz.map((v, k) => v - r.xyz[k]))));
  fly(r.xyz, Math.max(3.6, Math.min(24, far * 2.9)));
  say(r.truncated ? `Read the first ${r.tokens} tokens only; the rest is too long for the model.` : `${r.tokens} tokens, ${(r.ms / 1000).toFixed(1)} s.`);
}
$("go").onclick = () => working("Classifying…", async () => { if (!map) await loadMap(); if (truth && truth.text.trim() !== $("text").value.trim()) truth = null; await classify(); });
$("sample").onclick = () => working("Picking a text…", async () => { if (!map) await loadMap(); truth = await get("/api/classify/sample" + run()); $("text").value = truth.text; say("Classifying…"); await classify(); });
$("model").onchange = () => working("Loading the model…", async () => { const again = !!result; await loadMap(); if (again) { say("Classifying…"); await classify(); } });
$("text").addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) $("go").click(); });
$("whole").onclick = home;

// ── showing the profile ──
function el(tag, cls, ...kids) { const e = document.createElement(tag); if (cls) e.className = cls; e.append(...kids); return e; }
const tint = name => { const n = map.nodes[map.index[name]]; return n ? css(n.color) : "var(--rest)"; };
function bar(name, value, width, color) { const i = el("i"); i.style.width = Math.max(1.5, Math.min(100, width)) + "%"; i.style.background = color; return el("div", "bar", el("span", "", name), el("span", "", value), el("div", "", i)); }
const FLOWS = { territorialization: "Territorialization", deterritorialization: "Deterritorialization", line_of_flight: "Line of flight", bwo_approach: "BwO approach", reterritorialization: "Reterritorialization" };
function key(m) {
  const box = $("key"); box.textContent = "";
  for (const b of [...new Set(m.domains.map(d => m.nodes[m.index[d]].branch))]) { box.append(el("h3", "", b)); for (const d of m.domains.filter(d => m.nodes[m.index[d]].branch === b)) { const i = el("i"), k = el("button", "dom", i, d); i.style.background = css(m.domainColor[d]); k.onclick = () => fly(map.galaxy[d].c, map.galaxy[d].r * 2.6 + 1.2); box.append(k); } }
  const q = m.geometry; $("how").textContent = `The model works in ${q.dims} dimensions; about ${q.for80} of them hold 80% of the differences between territories, and any three hold at most ${Math.round(100 * q.three)}%. So the map follows the taxonomy first: each domain is a galaxy, the domains of a branch lie near each other, and territories lie near their parents and siblings. The model decides the rest: the more alike two are, the closer. Threads join territories that are alike to the model but far apart in the taxonomy. Each star is one labeled text, spread around its territory as stock LaBSE sees it. Point at a territory for its true neighbors in all ${q.dims} dimensions.`;
}
function show(r) {
  const out = $("out"); out.textContent = ""; out.hidden = false; out.scrollTop = 0; const i = map.index[r.best.node], n = map.nodes[i], agree = r.head[0] && r.head[0].node === r.best.node;
  const answer = el("div", "", r.best.node); answer.id = "answer"; out.append(el("p", "note", "Answer"), answer, el("p", "path", r.best.path.join(" → ")));
  if (truth) { const t = el("div", "box", el("b", "", truth.truth === r.best.node ? "Right. " : "Not the labeled answer. "), `The true label is ${truth.truth}.`, el("br"), `${truth.lang} · ${truth.source}`); t.id = "truth"; out.append(t); }
  if (map.trust) out.append(el("div", "box", el("b", "", agree ? "Both opinions agree. " : "The two opinions differ. "), agree ? `On the holdout, such answers were right ${Math.round(100 * map.trust.agree)}% of the time.` : `The trained prototypes say ${r.head[0].node}. On the holdout, such answers were right only ${Math.round(100 * map.trust.differ)}% of the time.`));
  if (n && n.twins.length) out.append(el("div", "box", el("b", "", "It has a twin. "), `${n.name} is built from the same texts as ${n.twins.map(j => map.nodes[j].name).join(", ")}, so the model cannot tell them apart.`));
  out.append(el("h2", "", "Active territories"), el("p", "note", "How strongly the text lands in each, next to the strongest. The answer also weighs its neighbors and its path, so it need not be the longest bar."));
  for (const a of r.active) out.append(bar(a.node, a.mass.toFixed(0) + "%", a.mass, tint(a.node)));
  if (!r.active.some(a => a.node === r.best.node)) out.append(el("p", "note", `${r.best.node} wins on its neighborhood; it is not among the strongest alone.`));
  out.append(el("h2", "", "Areas")); for (const a of r.areas) { const dot = el("i", "dot"); dot.style.background = css(map.domainColor[a.area] || [.5, .5, .5]); const d = el("p", "area", dot, el("b", "", a.area)); if (a.nodes.length) d.append(" ", el("span", "", a.nodes.join(", "))); out.append(d); }
  out.append(el("h2", "", "Second opinion: the trained prototypes")); for (const h of r.head.slice(0, 3)) out.append(bar(h.node, (100 * h.p).toFixed(0) + "%", 100 * h.p, tint(h.node)));
  out.append(el("h2", "", "Flow")); for (const [k, v] of Object.entries(r.flow.intensities).sort((a, b) => b[1] - a[1])) out.append(bar(FLOWS[k] || k, v.toFixed(2), 100 * v, "var(--rest)"));
  const table = el("table"), head = el("tr"); for (const h of ["Territory", "Cosine", "Sigma", "Score", "Gram"]) head.append(el("th", "", h)); table.append(head);
  for (const a of r.ranked) { const tr = el("tr"); for (const v of [a.node, a.cosine.toFixed(3), a.sigma_dist.toFixed(2), a.production.toFixed(3), a.gram === null ? "" : a.gram.toFixed(4)]) tr.append(el("td", "", v)); table.append(tr); }
  out.append(el("details", "", el("summary", "", "The 15 closest, in numbers"), el("div", "scroll", table)));
}

// ── start ──
(async () => {
  try {
    if (!gl) throw new Error("This browser cannot draw the map (no WebGL 2).");
    initGL(); resize(); requestAnimationFrame(frame);
    const models = await get("/api/classify/models");
    if (!models.length) { say("No trained model yet. Train one with: python -m train fit", true); $("go").disabled = $("sample").disabled = true; return; }
    for (const m of models) { const o = el("option", "", `${m.root ? m.root + ", loop" : "Loop"} ${m.seq}${m.champion ? ", champion" : ""}${m.deployed ? `: ${(100 * m.deployed).toFixed(1)}% on the holdout` : ""}`); o.value = m.id; $("model").append(o); }
    const q = new URLSearchParams(location.search); if (q.get("run")) $("model").value = q.get("run"); if (!$("model").value) $("model").selectedIndex = 0;
    await working("Loading the model…", loadMap); if (q.get("text") && map) { $("text").value = q.get("text"); await working("Classifying…", classify); }
  } catch (e) { say(e.message, true); }
})();
</script>
</body>
