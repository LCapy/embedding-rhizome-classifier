name: Keep HF Space Awake

# Pings the /health endpoint every 24 hours so the free Space never
# hits the 48-hour inactivity sleep limit.
# Also runs on push to main so you can verify it works immediately.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   HF_SPACE_URL  the Space's URL, e.g. https://your-username-coredrill.hf.space
#   HF_TOKEN      a Hugging Face token with read access to the Space. A private
#                 Space rejects requests without one before they reach the app.

on:
  schedule:
    - cron: "0 12 * * *"   # every day at 12:00 UTC
  push:
    branches: [main]
  workflow_dispatch:        # allow manual trigger from the Actions tab

jobs:
  ping:
    name: Ping HF Space
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        env:
          HF_SPACE_URL: ${{ secrets.HF_SPACE_URL }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # A missing secret is a configuration error, not a transient one, so
          # the run fails. It used to exit 0 here, which showed a green run
          # every day while nothing was pinged.
          if [ -z "$HF_SPACE_URL" ]; then
            echo "::error::HF_SPACE_URL secret is not set, so the Space is not being pinged."
            exit 1
          fi

          AUTH=()
          if [ -n "$HF_TOKEN" ]; then
            AUTH=(-H "Authorization: Bearer $HF_TOKEN")
          else
            echo "::warning::HF_TOKEN secret is not set. A private Space rejects unauthenticated requests."
          fi

          echo "Pinging $HF_SPACE_URL/health ..."

          # Retry up to 5 times with 30s gaps - Space may be cold-starting
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                     --max-time 120 \
                     "${AUTH[@]}" \
                     "$HF_SPACE_URL/health" || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Space is alive."
              exit 0
            fi
            echo "Not ready yet, waiting 30s ..."
            sleep 30
          done

          # Do not fail the workflow - Space may just be rebuilding
          echo "::warning::Space did not respond with 200 after 5 attempts (last status $STATUS)."
          exit 0
